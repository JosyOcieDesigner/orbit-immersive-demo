<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Cek Artis</title>
<link rel="icon" href="cek-artis-logo.png" />
<style>
  html,body{margin:0;background:#090909;overscroll-behavior:none}
  #scene{position:fixed;inset:0;width:100vw;height:100vh;display:block;touch-action:pan-y}
  /* scroll track: one screen per camera point (room → laptop → desk) */
  .track{height:300vh}
  .loader{position:fixed;left:0;top:0;height:2px;width:0;background:#ff7a2e;transition:width .2s,opacity .6s;z-index:3}
  .loader.done{opacity:0}
  .dots{position:fixed;right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:14px;z-index:2}
  .dots button{width:10px;height:10px;border-radius:50%;border:1px solid #ff7a2e;background:transparent;padding:0;cursor:pointer;transition:background .3s,transform .3s}
  .dots button.on{background:#ff7a2e;transform:scale(1.3)}
  .vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55));z-index:1}
  @media(max-width:700px){.dots{right:14px}}
</style>
</head>
<body>
<!--
  3D: "Basement Home Office #BADeskChallenge" by Fatih174 (CC BY 4.0)
      https://sketchfab.com/3d-models/basement-home-office-badeskchallenge-324ceb119c754bed973ab7a603750742
      "ASUS TUF DASH F15 LAPTOP" by uday (Sketchfab Standard)
-->
<canvas id="scene" aria-label="Ruang kerja basement 3D. Scroll untuk zoom ke laptop, lalu ke meja."></canvas>
<div class="vignette"></div>
<div class="loader" id="loader"></div>
<nav class="dots" aria-label="Titik kamera">
  <button aria-label="Ruangan" data-i="0" class="on"></button>
  <button aria-label="Laptop" data-i="1"></button>
  <button aria-label="Meja" data-i="2"></button>
</nav>
<div class="track"></div>
<script type="module" src="office.js?v=1"></script>
</body>
</html>
