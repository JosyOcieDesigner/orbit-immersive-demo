<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cek Artis</title>
<link rel="icon" href="cek-artis-logo.png" />
<link rel="preload" as="image" href="media/concert-first.jpg" />
<style>
  html,body{margin:0;background:#07090c;overscroll-behavior:none}
  .stage{position:fixed;inset:0;overflow:hidden;background:#07090c url(media/concert-first.jpg) center/cover no-repeat}
  /* slightly oversized so the frame can drift with the pointer for depth */
  #film{position:absolute;left:-3%;top:-3%;width:106%;height:106%;display:block;transform:translate3d(var(--x,0),var(--y,0),0);transition:transform .9s cubic-bezier(.2,.7,.2,1);will-change:transform}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45))}
  .track{position:relative;pointer-events:none}
  .bar{position:fixed;left:0;top:0;height:2px;width:0;background:rgba(255,255,255,.7);transition:width .25s,opacity .8s;z-index:3}
  .bar.done{opacity:0}
  /* scroll hint: mouse outline with a moving wheel (no text) */
  .hint{position:fixed;left:50%;bottom:34px;width:26px;height:42px;margin-left:-13px;border:2px solid rgba(255,255,255,.75);border-radius:14px;box-sizing:border-box;transition:opacity .6s;z-index:2}
  .hint::after{content:"";position:absolute;left:50%;top:7px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#fff;animation:wheel 1.6s ease-in-out infinite}
  .hint.gone{opacity:0}
  @keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(12px);opacity:0}100%{opacity:0}}
  @media (pointer:coarse){.hint{border-radius:50%;width:34px;height:34px;margin-left:-17px;border-width:2px}.hint::after{top:auto;bottom:7px;height:4px;width:4px;animation:swipe 1.6s ease-in-out infinite}}
  @keyframes swipe{0%{transform:translateY(0);opacity:1}70%{transform:translateY(-14px);opacity:0}100%{opacity:0}}
</style>
</head>
<body>
<main class="stage">
  <canvas id="film" aria-label="Scroll: kamera menembus awan, turun ke festival, lalu masuk ke dalam tenda konser"></canvas>
  <div class="vignette"></div>
</main>
<div class="bar" id="bar"></div>
<div class="hint" id="hint" aria-hidden="true"></div>
<div class="track" id="track"></div>
<script>
(() => {
  const COUNT = 358;                       // frames in the film (24 fps × 14.9 s)
  const canvas = document.getElementById('film'), ctx = canvas.getContext('2d');
  const track = document.getElementById('track'), bar = document.getElementById('bar'), hint = document.getElementById('hint');
  const coarse = matchMedia('(pointer: coarse)').matches;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const slowNet = navigator.connection && (/2g|3g/.test(navigator.connection.effectiveType || '') || navigator.connection.saveData);
  const dir = (Math.min(screen.width, screen.height) < 800 || slowNet) ? 'media/frames-540/' : 'media/frames-720/';

  /* scroll length: ~13 mouse-wheel notches on desktop, ~12 swipes on phones */
  const distance = () => coarse ? innerHeight * 5.5 : 1300;
  const layout = () => { track.style.height = (innerHeight + distance()) + 'px'; };

  /* ---- progressive frame loading: coarse pass over the whole film first, then fill the gaps ---- */
  const frames = new Array(COUNT); let loadedCount = 0;
  const order = []; const seen = new Set();
  for (const step of [32, 16, 8, 4, 2, 1]) for (let i = 0; i < COUNT; i += step) if (!seen.has(i)) { seen.add(i); order.push(i); }
  if (!seen.has(COUNT - 1)) order.splice(1, 0, COUNT - 1); else { order.splice(order.indexOf(COUNT - 1), 1); order.splice(1, 0, COUNT - 1); }
  let next = 0;
  const pump = () => {
    if (next >= order.length) return;
    const i = order[next++], img = new Image();
    img.decoding = 'async';
    img.onload = () => { frames[i] = img; loadedCount++; bar.style.width = (loadedCount / COUNT * 100) + '%'; if (loadedCount === COUNT) bar.classList.add('done'); if (Math.abs(i - shown) < 40) dirty = true; pump(); };
    img.onerror = pump;
    img.src = dir + String(i + 1).padStart(3, '0') + '.webp';
  };
  for (let k = 0; k < 8; k++) pump();

  /* sharp still for the final scene */
  const finalImg = new Image(); let finalReady = false;
  finalImg.onload = () => { finalReady = true; dirty = true; };
  setTimeout(() => { finalImg.src = 'media/concert-last.jpg'; }, 1500);

  /* ---- drawing ---- */
  let cw = 0, ch = 0;
  const resize = () => {
    layout();
    const dpr = Math.min(devicePixelRatio || 1, 2), r = canvas.getBoundingClientRect();
    cw = canvas.width = Math.round(r.width * dpr); ch = canvas.height = Math.round(r.height * dpr);
    dirty = true;
  };
  const nearest = i => { for (let d = 0; d < COUNT; d++) { if (frames[i - d]) return frames[i - d]; if (frames[i + d]) return frames[i + d]; } return null; };
  const draw = img => {
    const s = Math.max(cw / img.naturalWidth, ch / img.naturalHeight), w = img.naturalWidth * s, h = img.naturalHeight * s;
    ctx.drawImage(img, (cw - w) / 2, (ch - h) / 2, w, h);
  };

  /* ---- scroll → frame, eased so it plays like footage between wheel notches ---- */
  const target = () => { const max = Math.max(1, document.documentElement.scrollHeight - innerHeight); return Math.min(1, Math.max(0, scrollY / max)) * (COUNT - 1); };
  let pos = target(), shown = -1, dirty = true, prev = performance.now();
  const frame = now => {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
    const t = target();
    pos = reduce ? t : pos + (t - pos) * (1 - Math.exp(-dt * 7));
    if (Math.abs(t - pos) < 0.05) pos = t;
    const idx = Math.round(pos);
    if (idx !== shown || dirty) {
      const atEnd = idx >= COUNT - 1 && finalReady;
      const img = atEnd ? finalImg : nearest(idx);
      if (img) { draw(img); shown = idx; dirty = false; }
    }
    hint.classList.toggle('gone', scrollY > 20);
  };

  addEventListener('resize', resize);
  resize();
  requestAnimationFrame(frame);

  /* gentle depth: the frame drifts against the pointer / device tilt */
  const drift = (nx, ny) => { if (reduce) return; canvas.style.setProperty('--x', (-nx * 1.6) + '%'); canvas.style.setProperty('--y', (-ny * 1.6) + '%'); };
  addEventListener('pointermove', e => drift(e.clientX / innerWidth - .5, e.clientY / innerHeight - .5));
  addEventListener('deviceorientation', e => { if (e.gamma != null) drift(Math.max(-1, Math.min(1, e.gamma / 30)) / 2, Math.max(-1, Math.min(1, (e.beta - 45) / 30)) / 2); });
})();
</script>
</body>
</html>
