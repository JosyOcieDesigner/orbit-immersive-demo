<!doctype html>
<html lang="id" class="locked">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cek Artis</title>
<link rel="icon" href="cek-artis-logo.png" />
<link rel="preload" as="image" href="media/concert-first.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;800&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;background:#07090c;overscroll-behavior:none}
  .stage{position:fixed;inset:0;overflow:hidden;background:#07090c url(media/concert-first.jpg) center/cover no-repeat}
  /* slightly oversized so the frame can drift with the pointer for depth */
  .layer{position:absolute;left:-3%;top:-3%;width:106%;height:106%;transform:translate3d(var(--x,0),var(--y,0),0);transition:transform .9s cubic-bezier(.2,.7,.2,1);will-change:transform}
  /* the canvas holds frames at their own resolution; the GPU scales it to the screen */
  #film{position:absolute;inset:0;width:100%;height:100%;display:block}
  #final{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;visibility:hidden}
  #final.show{opacity:1;visibility:visible}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45))}
  .track{position:relative;pointer-events:none}
  .bar{position:fixed;left:0;top:0;height:2px;width:0;background:rgba(255,255,255,.7);transition:width .25s,opacity .8s;z-index:3}
  .bar.done{opacity:0}
  /* scroll hint: mouse outline with a moving wheel (no text) */
  /* scroll hint after the opening page: icon + short label */
  .hint{position:fixed;left:50%;bottom:30px;transform:translate(-50%,10px);z-index:2;display:flex;flex-direction:column;align-items:center;gap:12px;pointer-events:none;
    font:600 11px/1 Inter,"Helvetica Neue",Arial,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:rgba(244,247,248,.85);text-shadow:0 1px 12px rgba(0,0,0,.5);
    opacity:0;transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
  .hint.ready{opacity:1;transform:translate(-50%,0)}
  .hint.ready.gone{opacity:0;transform:translate(-50%,10px)}
  .hint .icon{position:relative;width:24px;height:38px;border:2px solid rgba(255,255,255,.8);border-radius:13px;box-sizing:border-box}
  .hint .icon::after{content:"";position:absolute;left:50%;top:7px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:#fff;animation:wheel 1.6s ease-in-out infinite}
  .hint .touch{display:none}
  @keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(12px);opacity:0}100%{opacity:0}}
  @media (pointer:coarse){.hint .icon{border-radius:50%;width:32px;height:32px}.hint .icon::after{top:auto;bottom:6px;height:4px;width:4px;animation:swipe 1.6s ease-in-out infinite}.hint .mouse{display:none}.hint .touch{display:inline}}
  @keyframes swipe{0%{transform:translateY(0);opacity:1}70%{transform:translateY(-14px);opacity:0}100%{opacity:0}}

  /* ---------- opening page (before scrolling) ---------- */
  html.locked,html.locked body{overflow:hidden;height:100%}
  .intro{--ink:#f4f7f8;--silver:220,230,235;position:fixed;inset:0;z-index:5;display:grid;place-items:center;overflow:hidden;
    font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:var(--ink);text-align:center;
    background:radial-gradient(ellipse 70% 60% at 50% 50%,rgba(12,14,17,.15),rgba(8,9,11,.62));
    transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.7,.2,1),filter .9s ease}
  /* exit choreography once a version is chosen (about 1.6 s) */
  .intro.leave{pointer-events:none}
  .intro.leave.fade{opacity:0;transition:opacity .7s ease}
  .intro .giant.split{background:none}
  .intro .giant span{display:inline-block;background:linear-gradient(180deg,rgba(var(--silver),.34),rgba(var(--silver),.10) 70%,rgba(var(--silver),.04));-webkit-background-clip:text;background-clip:text;color:transparent;
    --t:calc(.08s + var(--d) * 60ms);transition:transform 1.2s cubic-bezier(.3,.05,.15,1) var(--t),filter .8s ease calc(var(--t) + .25s),opacity .7s ease calc(var(--t) + .35s)}
  .intro.leave .giant span{opacity:0;filter:blur(14px);transform:translate3d(calc(var(--o) * 38vw),calc(-6vh - (1 - var(--o) * var(--o)) * 10vh),0) scale(1.6) rotate(calc(var(--o) * 8deg))}
  .intro h1 .line{display:block;overflow:hidden;padding:.06em 0 .1em;margin:-.06em 0 -.1em}
  .intro h1 .line>span{display:block;transition:transform .9s cubic-bezier(.7,0,.2,1),opacity .9s ease}
  .intro h1 .line:nth-child(2)>span{transition-delay:.08s}
  .intro.leave h1 .line>span{transform:translateY(-115%);opacity:.2}
  .intro .actions button{transition:transform .45s cubic-bezier(.5,0,.2,1),opacity .4s ease,background .25s ease,color .25s ease,border-color .25s ease}
  .intro.leave .actions button{opacity:0;transform:translateY(18px)}
  .intro.leave .actions button:nth-child(2){transition-delay:.05s}
  .intro .burst{transition:transform 1.5s cubic-bezier(.4,0,.2,1) .15s,opacity 1.2s ease .3s}
  .intro.leave .burst{transform:translate(-50%,-50%) scale(1.9);opacity:0}
  .intro.gone{display:none}
  /* giant word behind the headline, bleeding off both edges */
  .intro .giant{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);margin:0;white-space:nowrap;pointer-events:none;user-select:none;
    font-weight:800;font-size:clamp(90px,14.5vw,260px);line-height:.8;letter-spacing:-.055em;
    background:linear-gradient(180deg,rgba(var(--silver),.34),rgba(var(--silver),.10) 70%,rgba(var(--silver),.04));
    -webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.4s cubic-bezier(.2,.7,.2,1) both}
  /* thin radiating lines behind the centre, slowly turning */
  .intro .burst{position:absolute;left:50%;top:50%;width:min(78vmin,700px);height:min(78vmin,700px);transform:translate(-50%,-50%);pointer-events:none;opacity:.9}
  .intro .burst svg{width:100%;height:100%;animation:spin 90s linear infinite}
  .intro .content{position:relative;display:flex;flex-direction:column;align-items:center;gap:clamp(22px,4vh,40px);padding:0 24px}
  .intro .title{position:relative;display:grid;place-items:center}
  .intro h1{position:relative;margin:0;font-weight:800;font-size:clamp(42px,7vw,112px);line-height:.96;letter-spacing:-.04em;text-shadow:0 2px 40px rgba(0,0,0,.35);animation:rise 1.1s .15s cubic-bezier(.2,.7,.2,1) both}
  .intro .actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;animation:rise 1s .35s cubic-bezier(.2,.7,.2,1) both}
  .intro button{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 26px;border-radius:999px;cursor:pointer;
    font:600 15px/1 Inter,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.01em;color:var(--ink);
    background:rgba(255,255,255,.06);border:1px solid rgba(var(--silver),.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    transition:transform .25s ease,background .25s ease,color .25s ease,border-color .25s ease}
  .intro button svg{width:18px;height:18px;flex:none}
  .intro button:hover{transform:translateY(-2px);background:rgba(255,255,255,.14)}
  .intro button.primary{background:#e9eff1;color:#0c0e11;border-color:#e9eff1}
  .intro button.primary:hover{background:#fff}
  .intro button:focus-visible{outline:2px solid #fff;outline-offset:3px}
  @keyframes rise{from{opacity:0;transform:translate(var(--tx,0),calc(var(--ty,0px) + 24px))}to{opacity:1;transform:translate(var(--tx,0),var(--ty,0))}}
  .intro .giant{--tx:-50%;--ty:-50%}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:600px){.intro .giant{font-size:17vw}.intro .actions{flex-direction:column;width:min(320px,100%)}.intro button{justify-content:center}}
  @media(prefers-reduced-motion:reduce){.intro *{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}.intro.leave.fade{transition:opacity .3s}}
  /* WE CREATE. / WE CONNECT. / WE MAKE IT HAPPEN. — appear word by word from the clouds, camera flies through */
  .words{position:fixed;inset:0;z-index:1;pointer-events:none;display:grid;place-items:center;
    font-family:Inter,"Helvetica Neue",Arial,sans-serif;text-align:center}
  .words .phrase{grid-area:1/1;margin:0;max-width:96vw;padding:0 2vw;box-sizing:border-box;
    font-weight:800;font-size:clamp(56px,12.5vw,232px);line-height:.92;letter-spacing:-.045em;text-transform:uppercase;
    color:#eef2f4;text-shadow:0 2px 24px rgba(0,0,0,.38),0 0 30px rgba(210,225,235,.28),0 0 90px rgba(210,225,235,.14);
    opacity:0;will-change:transform,opacity,filter;transform-origin:50% 50%}
  .words .w{display:inline-block;margin:0 .02em;opacity:0;will-change:transform,opacity,filter}
  /* empty information panel that settles in once the film reaches the LED wall */
  .info{position:fixed;left:0;right:0;top:50%;z-index:3;height:50vh;min-height:220px;box-sizing:border-box;
    border-top:1px solid rgba(255,255,255,.22);border-bottom:1px solid rgba(255,255,255,.22);
    background:linear-gradient(180deg,rgba(10,13,18,.46),rgba(10,13,18,.58));
    box-shadow:0 0 60px rgba(0,0,0,.25);
    -webkit-backdrop-filter:blur(5px) saturate(1.1);backdrop-filter:blur(5px) saturate(1.1);
    opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-50%) scaleY(.6);filter:blur(4px);
    transition:opacity .8s ease,transform 1s cubic-bezier(.2,.75,.2,1),filter .8s ease,visibility 0s linear .8s}
  .info.show{opacity:1;visibility:visible;pointer-events:auto;transform:translateY(-50%) scaleY(1);filter:none;transition-delay:0s}
  @media(prefers-reduced-motion:reduce){.info{transition:opacity .3s,visibility 0s linear .3s;transform:translateY(-50%);filter:none}}
  /* "Rotate your smartphone" hint after choosing Mobile Version */
  .rotate{position:fixed;inset:0;z-index:6;display:none;place-items:center;text-align:center;cursor:pointer;
    font-family:Inter,"Helvetica Neue",Arial,sans-serif;color:#f4f7f8;background:rgba(8,9,11,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    opacity:0;transition:opacity .5s ease}
  .rotate.show{display:grid}.rotate.in{opacity:1}
  .rotate .box{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px}
  .rotate svg{width:92px;height:92px;animation:turn 2.4s cubic-bezier(.6,0,.2,1) infinite}
  .rotate strong{font-weight:800;font-size:clamp(26px,6.5vw,44px);line-height:1;letter-spacing:-.035em}
  .rotate span{font-weight:500;font-size:14px;color:rgba(220,230,235,.7)}
  @keyframes turn{0%,15%{transform:rotate(0)}55%,85%{transform:rotate(-90deg)}100%{transform:rotate(0)}}
  @media(prefers-reduced-motion:reduce){.rotate svg{animation:none;transform:rotate(-90deg)}}
</style>
</head>
<body>
<main class="stage">
  <div class="layer" id="layer">
    <canvas id="film" aria-label="Scroll: kamera menembus awan, turun ke festival, lalu masuk ke dalam tenda konser"></canvas>
    <img id="final" alt="" decoding="async" />
  </div>
  <div class="vignette"></div>
</main>
<div class="bar" id="bar"></div>
<div class="hint" id="hint" aria-hidden="true"><span class="icon"></span><span class="mouse">Scroll to explore</span><span class="touch">Swipe up to explore</span></div>
<div class="words" id="words" aria-live="polite">
  <p class="phrase">WE CREATE.</p>
  <p class="phrase">WE CONNECT.</p>
  <p class="phrase">WE MAKE IT HAPPEN.</p>
</div>
<div class="track" id="track"></div>
<section class="info" id="info" aria-label="Informasi"></section>
<section class="intro" id="intro" aria-labelledby="intro-title">
  <div class="content">
    <div class="title">
      <div class="burst" aria-hidden="true"><svg id="burst" viewBox="-350 -350 700 700"></svg></div>
      <p class="giant" aria-hidden="true" id="giant">CEKARTIS</p>
      <h1 id="intro-title"><span class="line"><span>Creative Art</span></span><span class="line"><span>Innovations</span></span></h1>
    </div>
    <div class="actions">
      <button type="button" data-profile="mobile" aria-label="Mobile Version, frame 960×540 lebih ringan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M11 18.5h2"/></svg>
        Mobile Version</button>
      <button type="button" data-profile="browser" aria-label="Browser Version, frame HD 1280×720">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="4" width="19" height="13" rx="2"/><path d="M8.5 20.5h7M12 17v3.5"/></svg>
        Browser Version</button>
    </div>
  </div>
</section>
<div class="rotate" id="rotate" role="dialog" aria-live="polite" aria-label="Rotate your smartphone">
  <div class="box">
    <svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="20" y="8" width="24" height="48" rx="5"/><path d="M29 50h6"/>
    </svg>
    <strong>Rotate your smartphone</strong>
    <span>Tap to continue</span>
  </div>
</div>
<script>
(() => {
  const COUNT = 358;                       // the site now ends on the last frame of video 1 (stage + LED wall); frames 359+ stay in media/frames-* unused
  const canvas = document.getElementById('film'), ctx = canvas.getContext('2d', { alpha: false });
  const layer = document.getElementById('layer'), finalImg = document.getElementById('final');
  const track = document.getElementById('track'), bar = document.getElementById('bar'), hint = document.getElementById('hint');
  const coarse = matchMedia('(pointer: coarse)').matches;
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const slowNet = navigator.connection && (/2g|3g/.test(navigator.connection.effectiveType || '') || navigator.connection.saveData);
  const suggested = (Math.min(screen.width, screen.height) < 800 || slowNet) ? 'mobile' : 'browser';
  /* two versions of the same frames (bytes unchanged): Mobile = 960×540 bundles, Browser = 1280×720 bundles */
  const PROFILES = {
    mobile:  { dir: 'media/packs-540/', FW: 960,  FH: 540, WINDOW: 24 },
    browser: { dir: 'media/packs-720/', FW: 1280, FH: 720, WINDOW: 36 },
  };
  let profile = suggested, dir, FW, FH, WINDOW;
  const useProfile = name => { profile = name; ({ dir, FW, FH, WINDOW } = PROFILES[name]); };
  useProfile(suggested);

  /* scroll length: ~13 wheel notches / ~12 swipes per 358 frames (≈70 notches / ≈63 swipes in total) */
  const PHRASE = () => coarse ? innerHeight * 1.4 : 420;                    // scroll per phrase (~4 wheel notches)
  /* scroll px -> frame, piecewise:
     WE CREATE. in the clouds (0–55) · pause · WE CONNECT. as the clouds open (65–95) · pause ·
     WE MAKE IT HAPPEN. before the tent roof (112–148) · end of scroll; frames 148–357 then autoplay at 24 fps */
  const AUTO_FROM = 148, AUTO_FPS = 24;   // after WE MAKE IT HAPPEN. the film plays by itself to the LED wall
  const knots = () => {
    const D = PHRASE(), G = D * .45;
    return [[0, 0], [D, 55], [D + G, 65], [2 * D + G, 95], [2 * D + 2 * G, 112], [3 * D + 2 * G, AUTO_FROM]];
  };
  const phraseStart = k => { const D = PHRASE(), G = D * .45; return k * (D + G); };
  const distance = () => { const k = knots(); return k[k.length - 1][0]; };

  /* ---- download: frames come in a few bundle files (original WebP bytes, unchanged), progressive order ---- */
  let blobs = new Array(COUNT), got = 0, gen = 0, abort = null;
  const gotFrame = i => { got++; bar.style.width = (got / COUNT * 100) + '%'; if (got === COUNT) bar.classList.add('done'); if (Math.abs(i - pos) <= WINDOW) wake(); };
  const load = () => {
    const my = ++gen, base = dir;
    if (abort) abort.abort();             // stop downloading the other version
    abort = new AbortController(); const signal = abort.signal;
    blobs = new Array(COUNT); got = 0; bar.classList.remove('done'); bar.style.width = '0';
    fetch(base + 'index.json', { signal }).then(r => r.json()).then(ix => {
      if (my !== gen) return;
      const inBundle = ix.bundles.map(() => []);
      ix.frames.forEach((f, i) => { if (f) inBundle[f[0]].push([i, f[1], f[2]]); });
      let next = 0;
      const fetchNext = () => {
        if (my !== gen || next >= ix.bundles.length) return;
        const b = next++;
        fetch(base + ix.bundles[b], { signal }).then(r => r.ok ? r.blob() : null).then(pack => {
          if (my !== gen || !pack) return;
          for (const [i, off, len] of inBundle[b]) { blobs[i] = pack.slice(off, off + len, 'image/webp'); gotFrame(i); }
        }).catch(() => {}).finally(fetchNext);
      };
      for (let k = 0; k < 3; k++) fetchNext();
    }).catch(() => {});
  };
  load();   // the suggested version starts loading behind the opening page

  /* ---- decode off the main thread, only near the current position ---- */
  const bitmaps = new Map(), decoding = new Set(); let active = 0;
  const decodeAround = c => {
    // free frames far from the playhead so memory stays flat
    for (const [i, bm] of bitmaps) if (Math.abs(i - c) > WINDOW + 8 && i !== shown) { bm.close && bm.close(); bitmaps.delete(i); }
    for (let d = 0; d <= WINDOW && active < 4; d++) for (const i of d ? [c + d, c - d] : [c]) {
      if (i < 0 || i >= COUNT || !blobs[i] || bitmaps.has(i) || decoding.has(i) || active >= 4) continue;
      decoding.add(i); active++;
      createImageBitmap(blobs[i]).then(bm => { bitmaps.set(i, bm); wake(); }).catch(() => {}).finally(() => { decoding.delete(i); active--; wake(); });
    }
  };

  /* ---- sizing: canvas backing store never exceeds what the frames can show ---- */
  let cw = 0, ch = 0;
  const resize = () => {
    track.style.height = (innerHeight + distance()) + 'px';
    const r = layer.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    const k = Math.min(1, FW / (r.width * dpr), FH / (r.height * dpr));   // cover-fit: frames are drawn 1:1, never upscaled in the canvas
    cw = canvas.width = Math.max(1, Math.round(r.width * dpr * k));
    ch = canvas.height = Math.max(1, Math.round(r.height * dpr * k));
    shown = -1; wake();
  };
  const draw = bm => {
    const s = Math.max(cw / bm.width, ch / bm.height), w = bm.width * s, h = bm.height * s;
    ctx.drawImage(bm, (cw - w) / 2, (ch - h) / 2, w, h);
  };
  const nearestBitmap = i => { for (let d = 0; d < COUNT; d++) { if (bitmaps.has(i - d)) return [i - d, bitmaps.get(i - d)]; if (bitmaps.has(i + d)) return [i + d, bitmaps.get(i + d)]; } return null; };

  /* sharp 1080p still for the resting final scene */
  let finalReady = false;
  finalImg.onload = () => { finalReady = true; wake(); };
  setTimeout(() => { finalImg.src = 'media/concert-last.jpg'; }, 1200);

  /* ---- scroll → frame, eased so it plays like footage; loop runs only while moving ---- */
  const info = document.getElementById('info');
  const maxScroll = () => Math.max(1, document.documentElement.scrollHeight - innerHeight);
  const sTarget = () => Math.min(maxScroll(), Math.max(0, scrollY));
  const frameAt = sp => {
    const k = knots(), scale = distance() / maxScroll();      // track height may differ by a pixel or two
    sp *= scale;
    for (let i = 1; i < k.length; i++) if (sp <= k[i][0]) {
      const [s0, f0] = k[i - 1], [s1, f1] = k[i];
      return f0 + (sp - s0) / Math.max(1, s1 - s0) * (f1 - f0);
    }
    return AUTO_FROM;
  };

  /* ---- words: emerge from the clouds one by one, then the camera flies through them ---- */
  const phrases = [...document.querySelectorAll('#words .phrase')].map(el => {
    el.innerHTML = el.textContent.split(' ').map(w => `<span class="w">${w}</span>`).join(' ');
    return { el, words: [...el.querySelectorAll('.w')] };
  });
  const clamp01 = v => Math.min(1, Math.max(0, v));
  const smooth = v => { v = clamp01(v); return v * v * (3 - 2 * v); };
  let entryAt = null;                         // first phrase rises on its own right after entering
  const renderWords = (sp, now) => {
    const D = PHRASE(); let busy = false;
    phrases.forEach((ph, k) => {
      const u = (sp - phraseStart(k)) / D;
      let pass, emerge;
      if (k === 0) {
        pass = clamp01((u - .3) / .7);
        emerge = w => {
          if (entryAt === null) return 0;
          const e = clamp01((now - entryAt - w * 420) / 950); if (e < 1) busy = true; return e;
        };
      } else {
        pass = clamp01((u - .58) / .42);
        emerge = w => clamp01((u - w / ph.words.length * .26) / .2);
      }
      const visible = (k === 0 ? u < 1 : u > 0 && u < 1) && pos <= AUTO_FROM + .5;   // hidden while the film is past the roof / rewinding
      if (!visible) { ph.el.style.opacity = 0; return; }
      // the camera pushes in slowly, then flies through the line
      const push = 1 + .06 * clamp01(k === 0 ? u / .3 : (u - .2) / .38);
      const fly = Math.pow(pass, 2.2) * 7;
      ph.el.style.opacity = 1 - smooth((pass - .35) / .6);
      ph.el.style.transform = `scale(${(push + fly).toFixed(4)})`;
      ph.el.style.filter = reduce ? '' : `blur(${(pass * 9).toFixed(2)}px)`;
      ph.words.forEach((w, i) => {
        const e = smooth(emerge(i));
        w.style.opacity = e;
        w.style.transform = `translate3d(0,${((1 - e) * 34).toFixed(1)}px,0) scale(${(.8 + .2 * e).toFixed(4)})`;
        w.style.filter = reduce ? '' : `blur(${((1 - e) * 16).toFixed(2)}px)`;
        w.style.color = `rgb(${Math.round(150 + 88 * e)},${Math.round(160 + 82 * e)},${Math.round(166 + 78 * e)})`;   // greyer while still in the fog
      });
    });
    return busy;
  };

  let sPos = sTarget(), pos = frameAt(sPos), shown = -1, shownExact = false, running = false, prev = 0;
  let playStart = null;                           // autoplay clock (ms) once the scroll reaches its end
  const tick = now => {
    const dt = prev ? Math.min(0.1, (now - prev) / 1000) : 0.016; prev = now;
    const st = sTarget();
    sPos = reduce ? st : sPos + (st - sPos) * (1 - Math.exp(-dt * 7));
    if (Math.abs(st - sPos) < .4) sPos = st;
    const atEnd = st >= maxScroll() - 2 && sPos >= maxScroll() - 2;
    let playing = false;
    if (atEnd) {
      // phrase three is gone: let the footage run on its own to the LED wall
      if (playStart === null) playStart = now - Math.max(0, pos - AUTO_FROM) / AUTO_FPS * 1000;
      pos = Math.min(COUNT - 1, AUTO_FROM + (now - playStart) / 1000 * AUTO_FPS);
      playing = pos < COUNT - 1;
    } else {
      playStart = null;
      const base = frameAt(sPos);
      // scrolled back up after the autoplay: rewind quickly instead of jumping
      pos = pos > base + .5 ? pos + (base - pos) * (1 - Math.exp(-dt * 4)) : base;
      if (pos > base + .5) playing = true;
    }
    const idx = Math.round(pos);
    decodeAround(Math.min(COUNT - 1, idx + (playing ? 12 : 0)));   // look ahead while the film runs
    if (idx !== shown || !shownExact) {
      const hit = nearestBitmap(idx);
      if (hit) { draw(hit[1]); shown = idx; shownExact = hit[0] === idx; }
    }
    finalImg.classList.toggle('show', finalReady && idx >= COUNT - 1);
    info.classList.toggle('show', pos >= COUNT - 1.5);          // information band once we reach the LED wall
    hint.classList.toggle('gone', scrollY > 20);
    const wordsBusy = renderWords(sPos, now);
    const settled = sPos === st && shown === idx && shownExact && !wordsBusy && !playing;
    if (settled && decoding.size === 0) { running = false; prev = 0; return; }
    requestAnimationFrame(tick);
  };
  const wake = () => { if (!running) { running = true; requestAnimationFrame(tick); } };

  /* ---- opening page: pick a version, then the film unlocks ---- */
  const intro = document.getElementById('intro'), buttons = [...intro.querySelectorAll('button')];
  buttons.forEach(btn => btn.classList.toggle('primary', btn.dataset.profile === suggested));
  (function splitGiant() {   // one span per letter so CEKARTIS can break apart on exit, centre letters first
    const el = document.getElementById('giant'), word = el.textContent, mid = (word.length - 1) / 2;
    el.classList.add('split');
    el.innerHTML = [...word].map((ch, i) => `<span style="--o:${((i - mid) / mid).toFixed(2)};--d:${Math.round(Math.abs(i - mid))}">${ch}</span>`).join('');
  })();
  (function drawBurst() {   // thin radiating lines like the reference, slightly irregular lengths
    const svg = document.getElementById('burst'); let d = '';
    for (let i = 0; i < 160; i++) {
      const a = i / 160 * Math.PI * 2, r0 = 120 + (i * 37 % 23), r1 = 250 + (i * 53 % 97);
      d += `M${(Math.cos(a) * r0).toFixed(1)} ${(Math.sin(a) * r0).toFixed(1)}L${(Math.cos(a) * r1).toFixed(1)} ${(Math.sin(a) * r1).toFixed(1)}`;
    }
    svg.innerHTML = `<path d="${d}" stroke="rgba(220,230,235,.42)" stroke-width="1" fill="none"/>`;
  })();
  const enter = name => {
    if (name !== profile) { useProfile(name); for (const [, bm] of bitmaps) bm.close && bm.close(); bitmaps.clear(); load(); resize(); }
    scrollTo(0, 0);
    document.documentElement.classList.remove('locked');
    intro.classList.add('leave');                                   // buttons drop, headline slides up, letters scatter
    setTimeout(() => intro.classList.add('fade'), reduce ? 0 : 1350);  // then the veil lifts off the clouds
    setTimeout(() => { entryAt = performance.now(); wake(); }, reduce ? 0 : 1250);   // WE CREATE. rises out of the clouds
    setTimeout(() => { intro.classList.add('gone'); hint.classList.add('ready'); }, reduce ? 300 : 2100);
    wake();
  };
  /* Mobile Version: ask to rotate first; continue on landscape, on tap, or after a moment if already landscape */
  const rotate = document.getElementById('rotate'), landscape = matchMedia('(orientation: landscape)');
  const askRotate = () => new Promise(done => {
    let closed = false, timer;
    const close = () => {
      if (closed) return; closed = true; clearTimeout(timer);
      landscape.removeEventListener('change', onTurn); rotate.removeEventListener('click', close);
      rotate.classList.remove('in'); setTimeout(() => rotate.classList.remove('show'), 500); done();
    };
    const onTurn = () => { if (landscape.matches) setTimeout(close, 600); };
    rotate.classList.add('show'); requestAnimationFrame(() => rotate.classList.add('in'));
    landscape.addEventListener('change', onTurn); rotate.addEventListener('click', close);
    if (landscape.matches) timer = setTimeout(close, 2200);
  });
  buttons.forEach(btn => btn.addEventListener('click', () => {
    const name = btn.dataset.profile;
    if (name === 'mobile') askRotate().then(() => enter(name)); else enter(name);
  }));

  addEventListener('scroll', wake, { passive: true });
  addEventListener('resize', resize);
  resize();

  /* gentle depth: the layer drifts against the pointer / device tilt (compositor only) */
  const drift = (nx, ny) => { if (reduce) return; layer.style.setProperty('--x', (-nx * 1.6) + '%'); layer.style.setProperty('--y', (-ny * 1.6) + '%'); };
  addEventListener('pointermove', e => drift(e.clientX / innerWidth - .5, e.clientY / innerHeight - .5), { passive: true });
  addEventListener('deviceorientation', e => { if (e.gamma != null) drift(Math.max(-1, Math.min(1, e.gamma / 30)) / 2, Math.max(-1, Math.min(1, (e.beta - 45) / 30)) / 2); });
})();
</script>
</body>
</html>
