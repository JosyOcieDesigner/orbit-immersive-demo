<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cek Artis</title>
<link rel="icon" href="cek-artis-logo.png" />
<link rel="preload" as="image" href="media/concert-first.jpg" />
<style>
  html,body{margin:0;height:100%;background:#07090c;overflow:hidden}
  .stage{position:fixed;inset:0;overflow:hidden;background:#07090c url(media/concert-first.jpg) center/cover no-repeat}
  .stage.ended{background-image:url(media/concert-last.jpg)}
  /* the film fills the screen; a small scale lets the final scene drift with the pointer for depth */
  #film{position:absolute;inset:-3%;width:106%;height:106%;object-fit:cover;transform:translate3d(var(--x,0),var(--y,0),0);transition:transform .9s cubic-bezier(.2,.7,.2,1);will-change:transform}
  .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.45))}
  .ctl{position:fixed;right:22px;bottom:22px;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(10,14,20,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;opacity:.75;transition:opacity .3s,transform .3s}
  .ctl:hover,.ctl:focus-visible{opacity:1;transform:scale(1.06)}
  .ctl svg{width:20px;height:20px}
  .ctl .on{display:none}.ctl[aria-pressed="true"] .on{display:block}.ctl[aria-pressed="true"] .off{display:none}
  .play{position:fixed;inset:0;margin:auto;width:76px;height:76px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:rgba(10,14,20,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;display:none;place-items:center;cursor:pointer;padding:0}
  .play.show{display:grid}.play svg{width:28px;height:28px;margin-left:4px}
  .ctl.replay{right:76px;display:none}.ctl.replay.show{display:grid}
  @media(max-width:700px){.ctl{right:16px;bottom:16px}.ctl.replay{right:68px}}
</style>
</head>
<body>
<main class="stage" id="stage">
  <video id="film" muted playsinline preload="auto" poster="media/concert-first.jpg" aria-label="Kamera menembus awan, turun ke festival, lalu masuk ke dalam tenda konser"></video>
  <div class="vignette"></div>
</main>
<button class="play" id="play" aria-label="Putar"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg></button>
<button class="ctl replay" id="replay" aria-label="Putar ulang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
<button class="ctl" id="sound" aria-label="Suara" aria-pressed="false">
  <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6M16 9l6 6"/></svg>
  <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>
</button>
<script>
(() => {
  const film = document.getElementById('film'), stage = document.getElementById('stage');
  const play = document.getElementById('play'), sound = document.getElementById('sound'), replay = document.getElementById('replay');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const small = Math.min(screen.width, screen.height) < 800 || (navigator.connection && /2g|3g/.test(navigator.connection.effectiveType || ''));
  film.src = small ? 'media/concert-720.mp4' : 'media/concert-1080.mp4';

  // hold the final scene: never loop, park on the last frame
  const hold = () => { stage.classList.add('ended'); replay.classList.add('show'); };
  film.addEventListener('ended', hold); // an ended <video> keeps showing its final frame

  const start = () => film.play().then(() => play.classList.remove('show')).catch(() => play.classList.add('show'));
  if (reduce) {
    // reduced motion: go straight to the last scene
    film.addEventListener('loadedmetadata', () => { film.currentTime = Math.max(0, film.duration - 0.04); hold(); }, { once: true });
    film.load();
  } else {
    start();
  }
  play.addEventListener('click', start);
  replay.addEventListener('click', () => { stage.classList.remove('ended'); replay.classList.remove('show'); film.currentTime = 0; start(); });

  sound.addEventListener('click', () => {
    film.muted = !film.muted;
    sound.setAttribute('aria-pressed', String(!film.muted));
    if (!film.muted && film.paused && !film.ended && !stage.classList.contains('ended')) start();
  });

  // gentle depth on the final scene: the frame drifts against the pointer / device tilt
  const drift = (nx, ny) => { if (reduce) return; film.style.setProperty('--x', (-nx * 1.6) + '%'); film.style.setProperty('--y', (-ny * 1.6) + '%'); };
  addEventListener('pointermove', e => drift(e.clientX / innerWidth - .5, e.clientY / innerHeight - .5));
  addEventListener('deviceorientation', e => { if (e.gamma != null) drift(Math.max(-1, Math.min(1, e.gamma / 30)) / 2, Math.max(-1, Math.min(1, (e.beta - 45) / 30)) / 2); });
})();
</script>
</body>
</html>
